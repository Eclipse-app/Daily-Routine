<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#5b5bf0;--pri2:#8b5cf6;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--soft:#eef0ff;--h1:#312e81;--h2:#5b5bf0;--h3:#8b5cf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--ink:#e8ecf8;--mut:#94a3b8;--line:#263050;--soft:#1e2547;--h1:#14183a;--h2:#2b2f7a;--h3:#4c3a9e}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--ink:#e8ecf8;--mut:#94a3b8;--line:#263050;--soft:#1e2547;--h1:#14183a;--h2:#2b2f7a;--h3:#4c3a9e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.5;transition:background .25s}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}
header{background:linear-gradient(135deg,var(--h1),var(--h2) 60%,var(--h3));color:#fff;padding:22px 16px 72px}
header .in{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);color:#fff;border:0;padding:8px 14px;border-radius:999px;font:700 14px Manrope,sans-serif;white-space:nowrap;cursor:pointer}
.pill option{color:#000}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px;border-radius:16px;margin:-34px 0 18px;overflow-x:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:700 14px Manrope,sans-serif;padding:10px 14px;border-radius:11px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:17px;font-weight:800}
.mut{color:var(--mut);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.week button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 2px;cursor:pointer;font:600 12px Manrope,sans-serif}
.week button b{display:block;font-size:16px}
.week button i{display:block;height:4px;border-radius:4px;background:var(--line);margin:6px 8px 0;overflow:hidden}
.week button i u{display:block;height:100%;background:var(--ok)}
.week button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.week button.today{box-shadow:0 0 0 2px var(--pri2)}
.top{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.task .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.task.done{background:var(--soft)}
.task.done .bx{background:var(--ok);border-color:var(--ok)}
.task.done .tx{text-decoration:line-through;color:var(--mut)}
.tag{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.reward{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;border:0}
.reward.open{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.bar{height:10px;background:rgba(128,128,128,.22);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:var(--ok);border-radius:9px}
input,select,textarea{font:500 14px Manrope,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:140px}
.btn{border:0;background:var(--pri);color:#fff;font:700 14px Manrope,sans-serif;padding:10px 16px;border-radius:11px;cursor:pointer}
.btn.g{background:var(--soft);color:var(--pri)}
.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:0 6px}
.edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.edit input{flex:1}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.chart u{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--pri2),var(--pri));min-height:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.stat{background:var(--soft);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;font-weight:800}
.goal h3{margin:0;font-size:16px}
.goal .r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.goal input[type=range]{width:100%;padding:0}
.rem{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rem.d span{text-decoration:line-through;color:var(--mut)}
.rem span{flex:1}
.dc{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.dc.t{border-color:var(--pri);box-shadow:0 0 0 2px var(--soft)}
.dc .h{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.dc .li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;cursor:pointer}
.dc .li i{flex:none;width:18px;height:18px;border-radius:6px;border:2px solid var(--line);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;margin-top:1px}
.dc .li.d i{background:var(--ok);border-color:var(--ok)}
.dc .li.d span{color:var(--mut);text-decoration:line-through}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:99px;font:700 13px Manrope,sans-serif;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tm{font-size:34px;font-weight:800;letter-spacing:1px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dots b{width:22px;height:28px;border-radius:6px 6px 9px 9px;background:var(--line)}
.dots b.f{background:#38bdf8}
.mood button{border:1px solid var(--line);background:var(--card);font-size:22px;border-radius:12px;padding:4px 8px;cursor:pointer;margin-right:4px}
.mood button.on{background:var(--soft);border-color:var(--pri)}
textarea{width:100%;margin-top:8px;resize:vertical}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
body{background:radial-gradient(900px 420px at 88% -8%,rgba(139,92,246,.2),transparent),radial-gradient(700px 400px at -10% 8%,rgba(56,189,248,.15),transparent),var(--bg);background-attachment:fixed}
header{position:relative;overflow:hidden;padding:32px 16px 88px}
header:before,header:after{content:"";position:absolute;border-radius:50%;filter:blur(44px);opacity:.55;background:#38bdf8;width:280px;height:280px;right:-60px;top:-100px;animation:fl 9s ease-in-out infinite alternate}
header:after{background:#f472b6;left:-90px;top:40px;width:230px;height:230px;animation-delay:-4s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.2)}}
header .in{position:relative;z-index:1}
h1{font-size:32px;background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:20px;box-shadow:0 10px 30px -14px rgba(30,30,90,.35)}
nav button{transition:.2s}
nav button:hover{color:var(--pri)}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px -6px var(--pri)}
.card{border-radius:22px;box-shadow:0 10px 30px -16px rgba(30,30,90,.25);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 14px -8px var(--pri);transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.g{background:var(--soft);box-shadow:none}
.task{transition:.15s;border-radius:16px}
.task:hover{transform:translateX(4px);border-color:var(--pri)}
.task.done .bx{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.4)}}
.ring{width:92px;height:92px;box-shadow:0 0 24px -8px var(--ok)}
.ring span{width:72px;height:72px;font-size:20px}
.lk{color:var(--pri);text-decoration:none;font-weight:800;margin-left:6px}
.rc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);transition:.2s}
.rc:hover{transform:translateY(-3px);border-color:var(--pri);box-shadow:0 12px 24px -14px var(--pri)}
.rc b{display:block}
.ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;flex:none}
.orb{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#7dd3fc,#2563eb 55%,#1e1b4b);box-shadow:0 0 0 6px rgba(56,189,248,.18),0 0 28px #38bdf8;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(56,189,248,.1),0 0 40px #38bdf8}}
.jl{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.bb{max-width:86%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--soft)}
.bb.u{align-self:flex-end;background:var(--pri);color:#fff;border-radius:16px 16px 4px 16px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:12px 16px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);z-index:50;max-width:320px;font-weight:700}
.rem.d input:not([type]){text-decoration:line-through;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--pri:#7c5cff;--pri2:#22d3ee;--bg:#f4f6fb;--line:#e5e9f2;--soft:#eef0ff;--h1:#4338ca;--h2:#7c5cff;--h3:#22d3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--card:#0e1424;--line:#1c2540;--soft:#171f3a;--h1:#0b1030;--h2:#2a2f8f;--h3:#0e7490}}

header{padding:22px 16px 60px}
h1{font-size:26px}
main{position:relative;margin-top:-34px}
nav i{font-style:normal;font-size:18px}
nav .brand{display:none;font-weight:800;font-size:18px;padding:6px 10px 16px;letter-spacing:-.3px}
nav .brand b{background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:22px}
@media(min-width:960px){body{padding-left:268px}
nav{position:fixed;left:14px;top:14px;bottom:14px;width:240px;margin:0;flex-direction:column;padding:16px 12px;gap:4px;border-radius:26px;overflow-y:auto}
nav .brand{display:block}
nav button{flex:none;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;font-size:15px}}
@media(max-width:959px){nav{position:fixed;top:auto;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin:0;z-index:20}
nav button{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;padding:6px 12px}
body{padding-bottom:84px}.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:24px;border-radius:26px;margin-bottom:14px;color:#fff;background:radial-gradient(500px 220px at 90% 0,rgba(34,211,238,.45),transparent),linear-gradient(135deg,#4f46e5,#7c5cff 60%,#a855f7);box-shadow:0 18px 40px -18px #6d4dff}
.hero span{opacity:.85;font-weight:600}
.hero h2{font-size:26px;margin:4px 0 12px;letter-spacing:-.5px}
.hc{display:flex;gap:8px;flex-wrap:wrap}
.hc b{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:6px 12px;border-radius:99px;font-size:13px}
.hero .btn{background:#fff;color:#4f46e5;box-shadow:none}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hm u{aspect-ratio:1;border-radius:8px;display:block}
.ai2{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;align-items:start}
@media(max-width:959px){.ai2{grid-template-columns:1fr}}
.jl{height:430px}
.bb{line-height:1.55}
.cd{position:relative;background:#0b1020;color:#e2e8f0;border-radius:12px;padding:12px;overflow:auto;font-size:12.5px;margin:8px 0;max-height:260px}
.cd .btn{position:absolute;right:6px;top:6px;padding:4px 9px;font-size:12px}
.orb.listen{animation:pu .8s infinite;background:radial-gradient(circle at 35% 30%,#fecaca,#ef4444 55%,#450a0a);box-shadow:0 0 30px #ef4444}
.orb.talk{animation:pu .5s infinite;background:radial-gradient(circle at 35% 30%,#bbf7d0,#10b981 55%,#064e3b);box-shadow:0 0 30px #10b981}
.tr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tr span{flex:1}
.tr em{font-style:normal;color:var(--mut);font-size:12px;width:26px}
label.btn{display:inline-flex;align-items:center}
</style>
</head>
